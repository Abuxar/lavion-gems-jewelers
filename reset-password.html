<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Reset Your Password — Lavion Gems &amp; Jewellers</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Montserrat:wght@200;300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles/main.css?v=5.7" />
</head>

<body>
  <div class="header-utility">
    <div class="header-utility-left"><a href="index.html">Return to Store</a></div>
    <div class="header-utility-right"><a href="index.html">Lavion Gems &amp; Jewellers</a></div>
  </div>

  <main class="auth-page">
    <div class="admin-modal-dialog auth-dialog" id="reset-card">
      <div class="auth-head">
        <span class="auth-mark">&#10022;</span>
        <h1 class="auth-title">Choose a new password</h1>
        <p class="auth-sub">This link can be used once and expires 30 minutes after it was sent.</p>
      </div>

      <form id="reset-form" class="auth-form" novalidate>
        <label class="auth-label" for="new-pass">New password</label>
        <input class="auth-input" type="password" id="new-pass" autocomplete="new-password" required />

        <label class="auth-label" for="confirm-pass">Confirm new password</label>
        <input class="auth-input" type="password" id="confirm-pass" autocomplete="new-password" required />
        <p class="auth-hint">At least 10 characters. Use something you do not reuse on other sites.</p>

        <button type="submit" class="btn-gold auth-submit">Update Password</button>
      </form>

      <p class="auth-foot"><a class="auth-link-btn" href="index.html">Back to the store</a></p>
    </div>
  </main>

  <script>
    (function () {
      var card = document.getElementById('reset-card');
      var form = document.getElementById('reset-form');
      var token = new URLSearchParams(location.search).get('token');

      function showError(message) {
        var box = form.querySelector('.auth-error');
        if (!box) {
          box = document.createElement('p');
          box.className = 'auth-error';
          form.prepend(box);
        }
        box.textContent = message;
      }

      function showDone(heading, message, cta) {
        card.innerHTML =
          '<div class="auth-head">' +
          '<span class="auth-mark">&#10022;</span>' +
          '<h1 class="auth-title"></h1><p class="auth-sub"></p></div>' +
          '<a class="btn-gold auth-submit" href="' + cta.href + '">' + cta.label + '</a>';
        card.querySelector('.auth-title').textContent = heading;
        card.querySelector('.auth-sub').textContent = message;
      }

      if (!token) {
        showDone('Link incomplete', 'This reset link is missing its token.',
          { href: 'index.html?signin=1', label: 'Request a New Link' });
        return;
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var pw = document.getElementById('new-pass').value;
        var confirm = document.getElementById('confirm-pass').value;

        if (pw.length < 10) return showError('Password must be at least 10 characters.');
        if (pw !== confirm) return showError('The two passwords do not match.');

        var btn = form.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.textContent = 'Updating…';

        fetch('/api/auth/reset-password', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: token, password: pw })
        })
          .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
          .then(function (res) {
            if (res.ok) {
              showDone('Password updated',
                'You are signed in, and every other device has been signed out.',
                { href: 'index.html', label: 'Continue to the Store' });
            } else {
              btn.disabled = false;
              btn.textContent = 'Update Password';
              showError((res.d && res.d.message) || 'This reset link is invalid or has expired.');
            }
          })
          .catch(function () {
            btn.disabled = false;
            btn.textContent = 'Update Password';
            showError('Could not reach the account service. Please try again shortly.');
          });
      });
    })();
  </script>
</body>

</html>
